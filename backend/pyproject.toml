[project]
name = "meridian"
version = "0.1.0"
description = "Meridian — a discovery scout swarm for Solana"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
swarm = ["swarms>=7.0"]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
